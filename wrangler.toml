name = "edgejump"
main = "src/worker.ts"
compatibility_date = "2026-07-01"
workers_dev = true

[build]
command = "npm run build:web"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api", "/api/*"]

[vars]
CONNECT_TIMEOUT_MS = "10000"
ENVIRONMENT = "production"
DEPLOY_TYPE = "production" # 部署模式: production (默认正式模式) | demo (演示站模式)

[triggers]
crons = ["*/15 * * * *"] # 每 15 分钟按请求预算清理一批；默认保留策略不执行删除

[[durable_objects.bindings]]
name = "SSH_SESSIONS"
class_name = "SSHSessionDO"

[[durable_objects.bindings]]
name = "RATE_LIMIT"
class_name = "RateLimitDO"

[[durable_objects.bindings]]
name = "PASSWORD_KDF"
class_name = "PasswordKdfDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SSHSessionDO", "RateLimitDO"]

[[migrations]]
tag = "v2-password-kdf"
new_sqlite_classes = ["PasswordKdfDO"]

[[d1_databases]]
binding = "DB"
database_name = "edgejump-db"
database_id = "local-edgejump-db" # 本地开发占位符；部署脚本会自动在目标账户中查找或创建，不把账户专属 ID 留在代码库
migrations_dir = "migrations"

# [可选] R2 对象存储桶（用于会话终端录像与审计回放；若不需要录像回放功能可保持注释）
# [[r2_buckets]]
# binding = "RECORDINGS"
# bucket_name = "edgejump-recordings"

[[kv_namespaces]]
binding = "KV_CACHE"
id = "local-edgejump-kv" # 本地开发占位符；部署脚本会自动在目标账户中查找或创建，不把账户专属 ID 留在代码库
