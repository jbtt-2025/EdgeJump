name = "edgejump"
main = "src/worker.ts"
compatibility_date = "2026-07-01"
workers_dev = true

[build]
command = "npm run build:web"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[vars]
CONNECT_TIMEOUT_MS = "10000"
ENVIRONMENT = "production"

[[durable_objects.bindings]]
name = "SSH_SESSIONS"
class_name = "SSHSessionDO"

[[durable_objects.bindings]]
name = "RATE_LIMIT"
class_name = "RateLimitDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SSHSessionDO", "RateLimitDO"]

[[d1_databases]]
binding = "DB"
database_name = "edgejump-db"
database_id = "local-edgejump-db"
migrations_dir = "migrations"

# [可选] R2 对象存储桶（用于会话终端录像与审计回放；若不需要录像回放功能可保持注释）
# [[r2_buckets]]
# binding = "RECORDINGS"
# bucket_name = "edgejump-recordings"

[[kv_namespaces]]
binding = "KV_CACHE"
id = "edgejump-kv"
